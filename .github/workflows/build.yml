name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/PureGuard-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PureGuard-apk
          path: out/*.apk

      - name: Publish release (easy download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PureGuard 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            Download **PureGuard-1.0.${{ github.run_number }}.apk** below on your Android phone and install it.
            Updates install over the existing app; you never need to uninstall.
